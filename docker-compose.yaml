services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: computer_club
      POSTGRES_USER: computer_club
      POSTGRES_PASSWORD: computer_club
    ports:
      - "5432:5432"
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD", "pg_isready", "-U", "computer_club" ]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    environment:
      DB_DSN: postgres://computer_club:computer_club@db:5432/computer_club?sslmode=disable
      HTTP_ADDR: :8080
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
    volumes:
      - ./static:/app/static

volumes:
  dbdata: